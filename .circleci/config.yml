version: 2.1

# Jekyll 3.0–3.7 rely on APIs removed in Ruby 3 (URI.escape, Fixnum, positional
# Hash args to File.read), so they are tested on Ruby 2.7. Jekyll 3.8+ is tested
# on Ruby 3.3. The gemfiles/*.gemfile files are generated by Appraisal and carry
# no `ruby` pin, so the same gemfile installs on whichever Ruby the job provides.
commands:
  test-jekyll-versions:
    parameters:
      gemfiles:
        type: string
      cache-key:
        type: string
    steps:
      - checkout
      - restore_cache:
          keys:
            - bundle-<< parameters.cache-key >>-{{ checksum "Gemfile.lock" }}
            - bundle-<< parameters.cache-key >>-
      - run:
          name: Run specs across Jekyll versions
          command: |
            set -e
            for gemfile in << parameters.gemfiles >>; do
              echo "===== ${gemfile} ====="
              BUNDLE_GEMFILE="gemfiles/${gemfile}" bundle install
              BUNDLE_GEMFILE="gemfiles/${gemfile}" bundle exec rspec
            done
      - save_cache:
          key: bundle-<< parameters.cache-key >>-{{ checksum "Gemfile.lock" }}
          paths:
            - ~/bundle

jobs:
  ruby-2.7:
    docker:
      - image: cimg/ruby:2.7.5
    environment:
      BUNDLE_PATH: ~/bundle
    steps:
      - test-jekyll-versions:
          cache-key: ruby2.7
          gemfiles: >-
            jekyll_3.0.5.gemfile jekyll_3.1.6.gemfile jekyll_3.2.1.gemfile
            jekyll_3.3.1.gemfile jekyll_3.4.5.gemfile jekyll_3.5.2.gemfile
            jekyll_3.6.3.gemfile jekyll_3.7.4.gemfile

  ruby-3.3:
    docker:
      - image: cimg/ruby:3.3.11
    environment:
      BUNDLE_PATH: ~/bundle
    steps:
      - test-jekyll-versions:
          cache-key: ruby3.3
          gemfiles: >-
            jekyll_3.8.7.gemfile jekyll_3.9.5.gemfile jekyll_3.10.0.gemfile

workflows:
  test:
    jobs:
      - ruby-2.7
      - ruby-3.3
